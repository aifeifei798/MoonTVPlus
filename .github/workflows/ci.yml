name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # setup-node@v5 检测到 package.json 的 packageManager 会自动缓存 pnpm，
          # 但该步骤早于 pnpm/action-setup（此时 pnpm 尚未安装）会报
          # "Unable to locate executable file: pnpm"；下方已有显式 Cache pnpm store 步骤
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-node22-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-node22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      - name: Generate runtime files
        # src/lib/runtime.ts 系生成文件（gitignored），typecheck/test/build 之前必须先生成
        run: pnpm gen:manifest && pnpm gen:runtime

      - name: Run linting
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm exec jest --ci

      - name: Build project
        run: pnpm run build
