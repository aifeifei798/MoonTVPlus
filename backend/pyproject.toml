[project]
name = "moontvplus-backend"
description = "FastAPI backend for MoonTVPlus, wire-compatible with MoonTV's /api/* surface"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "fakeredis>=2.30.0",  # the redis backend's oracle: scripts/redis_serve_fake.py has no real redis-server to talk to
    "python-multipart>=0.0.9",  # the data-migration import route's multipart form
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
